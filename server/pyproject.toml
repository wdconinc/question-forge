[project]
name = "question-forge-server"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    # Validation sandbox; matches Pyodide 0.27.0 (numpy 2.0.2).
    # 2.0.2 has no cp313 wheel, so pin the range. Bump with PYODIDE_INDEX in index.html.
    "numpy>=2.0,<2.2",
    "python-dotenv>=1.0",
    "anthropic>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
# Verbatim copy of python/__init__.py, kept byte-identical and checked with `cmp` in CI.
# Linting it here would force edits that break that check; lint the canonical file instead.
extend-exclude = ["questions.py"]

[tool.ruff.lint]
# E402: sys.path manipulation before imports is intentional (Python version filter)
ignore = ["E402"]
