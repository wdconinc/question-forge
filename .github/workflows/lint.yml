name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-client:
    name: ESLint (index.html)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  lint-server:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      # origin/main added scripts/; this branch added server/. Lint both.
      - run: ruff check server/ scripts/

      # The Fly build context is server/, so the Dockerfile cannot COPY the canonical
      # helpers from python/. server/questions.py is a verbatim copy; fail loudly if the
      # two drift, or the validation sandbox stops matching what the browser runs.
      - name: questions.py matches python/__init__.py
        run: cmp python/__init__.py server/questions.py

  test-server:
    name: Question contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # Installs the full dependency set from server/pyproject.toml + server/uv.lock
      # (fastapi, anthropic, etc.), not just the numpy/jinja2 that qvalidate.py needs,
      # so TestChatTurnContract's tests run instead of silently skipping.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run python test_qvalidate.py
