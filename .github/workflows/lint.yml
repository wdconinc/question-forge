name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-client:
    name: ESLint (index.html)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  lint-server:
    name: Ruff (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check server/

      # The Fly build context is server/, so the Dockerfile cannot COPY the canonical
      # helpers from python/. server/questions.py is a verbatim copy; fail loudly if the
      # two drift, or the validation sandbox stops matching what the browser runs.
      - name: questions.py matches python/__init__.py
        run: cmp python/__init__.py server/questions.py

  test-server:
    name: Question contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "numpy>=2.0,<2.2" "jinja2>=3.1"
      - run: python server/test_qvalidate.py
