name: Deploy server to Fly.io

on:
  push:
    branches: [main]
    paths:
      # server/questions.py is a verbatim copy of python/__init__.py. Editing the
      # canonical file alone will NOT redeploy the server - mirror it into server/.
      - "server/**"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
